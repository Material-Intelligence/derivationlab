[project]
name = "derivationlab-api"
version = "0.1.0"
description = "Local HTTP/SSE control plane for autonomous derivation runs"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "argon2-cffi>=25.1,<26",
  "fastapi>=0.140,<0.141",
  "starlette>=0.49,<1",
  "uvicorn>=0.35,<0.36",
  "zxcvbn>=4.5,<5",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1,<0.29",
  "jsonschema>=4.25,<5",
  "pytest>=8.4.1,<9",
  "ruff>=0.12.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["derivation_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
